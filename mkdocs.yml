site_name: EGR314 - Exploration Device
site_url: https://egr314-s-2026-201.github.io/
repo_url: https://github.com/EGR314-S-2026-201/EGR314-S-2026-201.github.io
edit_uri: edit/main/docs/
theme:
  name: material
  custom_dir: custom_theme/
  palette:
    primary: blue
    accent: indigo
  font:
    text: Roboto
  logo: static/logo-314.svg
  favicon: static/logo_314.png

  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - toc.follow    
    - navigation.top
    - navigation.path
    - navigation.indexes
    - navigation.prune
    - content.action.edit
    - navigation.footer
#    - navigation.sections
    - navigation.expand
#    - navigation.instant # doesn't work that well

markdown_extensions:
  - attr_list #add attributes using curly brackets to images, see https://squidfunk.github.io/mkdocs-material/reference/images/
  - md_in_html # see https://squidfunk.github.io/mkdocs-material/reference/images/
  - footnotes
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.tilde: {}
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

draft_docs: |
  **/*_unpublished.md
  **/*_draft.md
  **/*_draft**
  
plugins:
  - search
  - glightbox # allow resize images, see https://squidfunk.github.io/mkdocs-material/reference/images/

extra_css:
  - stylesheets/extra.css  

extra_javascript:
 - javascripts/mathjax.js
 - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
    
not_in_nav: |
  static
  
copyright: "Copyright &copy; 2026 Team 201"

extra:
  generator: false
  social:
    - icon: fontawesome/regular/file-code
      link: /2026_spring
      name: 2026 Site


nav:
  - Home: index.md
  - Organization: 01-Organization/Team-Organization.md
  - Concept Design: 02-Concept-Design/Design.md
  - Project Requirements: 03-Project-Requirements/Project-requirements.md
  - Team Block Diagram: 04-Team-Block-Diagram/Team-Diagram.md
  - Design Review: 05-Design-Review/Design-Review.md
  - Showcase: 06-Showcase-Demonstration/showcase.md
  - Prototype: 07-Prototype/prototype.md
  - Version 2.0: 08-Project-V2.0/v2.md
  - Appendix: Appendix/appendix.md
